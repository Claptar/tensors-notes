    .t { font-style: normal; }
    .small { font-size: 15px; }
    .sub { font-size: 13px; }
    .lbl-red { fill: #c0392b; }
    .lbl-blue { fill: #2563a8; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
  </style>
