    .dot-blue { fill: #2563a8; stroke: none; }
    text { fill: #1a1a1a; font-family: 'Times New Roman', Times, serif; font-size: 19px; }
    .m { font-style: italic; }
    .t { font-style: normal; }
    .small { font-size: 15px; }
    .sub { font-size: 13px; }
    .lbl-red { fill: #c0392b; }
    .lbl-blue { fill: #2563a8; }
    .mid { text-anchor: middle; }
    .end { text-anchor: end; }
