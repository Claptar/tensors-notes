<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250">
  <!-- lecture-notes:theme: follows light/dark; see .claude/skills/lecture-notes/scripts/theme_svg.py -->
  <defs><filter id="ln-dark" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="250" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.574 -1.430 -0.144 0 1  -0.426 -0.430 -0.144 0 1  -0.426 -1.430 0.856 0 1  0 0 0 1 0"/></filter></defs>
  <style>@media (prefers-color-scheme: dark) { .ln-theme { filter: url(#ln-dark); } }</style>
